# Phase 7 — ResNet-18 + CIFAR-100 Experiments Configuration
# Research-quality benchmark using pre-trained ResNet-18 on 100-class CIFAR-100.
# Run with: python scripts/run_experiments.py --config configs/experiments_resnet18_cifar100.yaml

meta:
  benchmark: "CIFAR-100 Continual Stream (ResNet-18)"
  baseline_checkpoint: "checkpoints/best_model_resnet18_cifar100.pt"
  output_dir: "results/experiments/resnet18_cifar100"
  dataset_name: "cifar100"
  dataset_root: "data/"
  seeds: [42]
  default_stream_size: 5000
  default_batch_size: 64

# ── Stream Conditions ────────────────────────────────────────────────────────
conditions:
  noisy_stream:
    name: "Standard Perturbed Stream (20% Noise)"
    label_noise_rate: 0.20
    feature_corruption_rate: 0.15
    redundancy_rate: 0.0
    description: "Primary evaluation: 20% label noise + 15% feature corruption on CIFAR-100."

  high_noise_stream:
    name: "High Noise Stream (40% Noise)"
    label_noise_rate: 0.40
    feature_corruption_rate: 0.15
    redundancy_rate: 0.0
    description: "Stress condition with 40% label corruption testing gate robustness on CIFAR-100."

  clean_stream:
    name: "Clean Stream"
    label_noise_rate: 0.0
    feature_corruption_rate: 0.0
    redundancy_rate: 0.0
    description: "Unperturbed stream measuring retention and plasticity under clean data."

# ── Primary Comparative Methods ──────────────────────────────────────────────
methods:
  update_all:
    name: "Conventional (Update-All)"
    type: "conventional"
    description: "Standard continual learner updating unconditionally on every stream sample."

  random:
    name: "Budget-Matched Random"
    type: "random"
    budget_rate: 0.35
    description: "Uniformly random sample selection matching the gate update budget (~35%)."

  uncertainty_only:
    name: "Active Learning (Uncertainty-Only)"
    type: "uncertainty_only"
    threshold: 0.35
    description: "Classical Active Learning baseline selecting samples by predictive entropy."

  gated_full:
    name: "Adaptive Learning Gate (Ours)"
    type: "gated"
    learn_threshold: 0.44
    ignore_threshold: 0.30
    w_novelty: 0.5
    w_uncertainty: 0.5
    w_unreliability: 0.8
    w_redundancy: 0.2
    defer_queue_capacity: 500
    recheck_interval: 2
    recheck_batch_size: 64
    description: "Full multi-signal gate with uncertainty, novelty, reliability, and deferral."

# ── Component Ablations ──────────────────────────────────────────────────────
ablations:
  ablation_no_novelty:
    name: "ALG w/o Novelty (w_nov=0)"
    type: "gated"
    learn_threshold: 0.44
    ignore_threshold: 0.30
    w_novelty: 0.0
    w_uncertainty: 0.5
    w_unreliability: 0.8
    w_redundancy: 0.2
    description: "Ablation removing the latent feature prototype novelty signal."

  ablation_no_reliability:
    name: "ALG w/o Reliability (w_unrel=0)"
    type: "gated"
    learn_threshold: 0.44
    ignore_threshold: 0.30
    w_novelty: 0.5
    w_uncertainty: 0.5
    w_unreliability: 0.0
    w_redundancy: 0.2
    use_reliability_coupling: false
    description: "Ablation disabling reliability checks."

  ablation_no_uncertainty:
    name: "ALG w/o Uncertainty (w_unc=0)"
    type: "gated"
    learn_threshold: 0.44
    ignore_threshold: 0.30
    w_novelty: 0.5
    w_uncertainty: 0.0
    w_unreliability: 0.8
    w_redundancy: 0.2
    description: "Ablation removing predictive entropy from benefit estimation."

